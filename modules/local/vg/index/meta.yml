name: vg_index
description: Build indexes for graph files (XG, distance index)
keywords:
  - index
  - pangenome
  - graph
  - vg
tools:
  - vg:
      description: Variation graph toolkit
      homepage: https://github.com/vgteam/vg
      documentation: https://github.com/vgteam/vg/wiki
      licence: ["MIT"]
      identifier: biotools:vg

input:
  - - meta:
        type: map
        description: Graph metadata
    - graph:
        type: file
        description: Graph file (VG, GBZ, or GFA format)
        pattern: "*.{vg,gbz,gfa}"

output:
  - dist:
      - meta:
          type: map
          description: Graph metadata
      - "*.dist":
          type: file
          description: Distance index for giraffe
          pattern: "*.dist"
  - xg:
      - meta:
          type: map
          description: Graph metadata
      - "*.xg":
          type: file
          description: XG index
          pattern: "*.xg"
  - versions:
      - "versions.yml":
          type: file
          description: File containing software versions
          pattern: "versions.yml"

authors:
  - "@jlalli"
maintainers:
  - "@jlalli"
