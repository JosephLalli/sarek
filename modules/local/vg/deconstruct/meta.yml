name: vg_deconstruct
description: Extract VCF from graph by comparing paths to a reference
keywords:
  - deconstruct
  - vcf
  - pangenome
  - variants
  - vg
tools:
  - vg:
      description: Variation graph toolkit
      homepage: https://github.com/vgteam/vg
      documentation: https://github.com/vgteam/vg/wiki
      licence: ["MIT"]
      identifier: biotools:vg

input:
  - - meta:
        type: map
        description: Graph metadata
    - graph:
        type: file
        description: Graph file (GBZ, XG, or VG)
        pattern: "*.{gbz,xg,vg}"
  - - ref_paths:
        type: file
        description: File listing reference paths to use (optional)
        pattern: "*.txt"

output:
  - vcf:
      - meta:
          type: map
          description: Graph metadata
      - "*.vcf":
          type: file
          description: VCF of variants in graph
          pattern: "*.vcf"
  - vcf_gz:
      - meta:
          type: map
          description: Graph metadata
      - "*.vcf.gz":
          type: file
          description: Compressed VCF
          pattern: "*.vcf.gz"
  - versions:
      - "versions.yml":
          type: file
          description: File containing software versions
          pattern: "versions.yml"

authors:
  - "@jlalli"
maintainers:
  - "@jlalli"
