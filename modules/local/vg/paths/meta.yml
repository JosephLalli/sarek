name: vg_paths
description: List, extract, or manipulate paths in a graph
keywords:
  - paths
  - pangenome
  - fasta
  - vg
tools:
  - vg:
      description: Variation graph toolkit
      homepage: https://github.com/vgteam/vg
      documentation: https://github.com/vgteam/vg/wiki
      licence: ["MIT"]
      identifier: biotools:vg

input:
  - - meta:
        type: map
        description: Graph metadata
    - graph:
        type: file
        description: Graph file (VG, GBZ, XG)
        pattern: "*.{vg,gbz,xg}"
  - - ref_paths:
        type: file
        description: File listing paths to extract (optional)
        pattern: "*.txt"

output:
  - fasta:
      - meta:
          type: map
          description: Graph metadata
      - "*.fa":
          type: file
          description: FASTA sequences from paths
          pattern: "*.fa"
  - fasta_fai:
      - meta:
          type: map
          description: Graph metadata
      - "*.fa.fai":
          type: file
          description: FASTA index
          pattern: "*.fa.fai"
  - path_list:
      - meta:
          type: map
          description: Graph metadata
      - "*.txt":
          type: file
          description: List of paths in graph
          pattern: "*.txt"
  - versions:
      - "versions.yml":
          type: file
          description: File containing software versions
          pattern: "versions.yml"

authors:
  - "@jlalli"
maintainers:
  - "@jlalli"
