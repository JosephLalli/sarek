name: vg_gbwt
description: Build and manipulate GBWT haplotype indexes
keywords:
  - gbwt
  - haplotype
  - pangenome
  - vg
tools:
  - vg:
      description: Variation graph toolkit
      homepage: https://github.com/vgteam/vg
      documentation: https://github.com/vgteam/vg/wiki
      licence: ["MIT"]
      identifier: biotools:vg

input:
  - - meta:
        type: map
        description: Graph/sample metadata
    - input_file:
        type: file
        description: Input file (GFA, VG, or existing GBWT)
        pattern: "*.{gfa,vg,gbwt,gbz}"

output:
  - gbwt:
      - meta:
          type: map
          description: Graph metadata
      - "*.gbwt":
          type: file
          description: GBWT haplotype index
          pattern: "*.gbwt"
  - gbz:
      - meta:
          type: map
          description: Graph metadata
      - "*.gbz":
          type: file
          description: GBZ graph with embedded GBWT
          pattern: "*.gbz"
  - gg:
      - meta:
          type: map
          description: Graph metadata
      - "*.gg":
          type: file
          description: GBWTGraph
          pattern: "*.gg"
  - translation:
      - meta:
          type: map
          description: Graph metadata
      - "*.txt":
          type: file
          description: Segment to node translation
          pattern: "*.txt"
  - versions:
      - "versions.yml":
          type: file
          description: File containing software versions
          pattern: "versions.yml"

authors:
  - "@jlalli"
maintainers:
  - "@jlalli"
