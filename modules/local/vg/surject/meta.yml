name: vg_surject
description: Project graph alignments (GAM) onto embedded linear paths to produce BAM/SAM
keywords:
  - alignment
  - pangenome
  - graph
  - surject
  - vg
  - bam
tools:
  - vg:
      description: Variation graph toolkit
      homepage: https://github.com/vgteam/vg
      documentation: https://github.com/vgteam/vg/wiki
      licence: ["MIT"]
      identifier: biotools:vg

input:
  - - meta:
        type: map
        description: Sample metadata
    - gam:
        type: file
        description: Graph alignment map file
        pattern: "*.gam"
  - - meta2:
        type: map
        description: Reference metadata
    - graph:
        type: file
        description: Graph index (GBZ, XG, or VG format)
        pattern: "*.{gbz,xg,vg}"
  - - ref_paths:
        type: file
        description: File listing reference paths to surject into
        pattern: "*.txt"

output:
  - bam:
      - meta:
          type: map
          description: Sample metadata
      - "*.bam":
          type: file
          description: BAM alignment file
          pattern: "*.bam"
  - sam:
      - meta:
          type: map
          description: Sample metadata
      - "*.sam":
          type: file
          description: SAM alignment file
          pattern: "*.sam"
  - versions:
      - "versions.yml":
          type: file
          description: File containing software versions
          pattern: "versions.yml"

authors:
  - "@jlalli"
maintainers:
  - "@jlalli"
