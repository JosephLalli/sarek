name: vg_convert
description: Convert between graph formats (GFA, GBZ, VG, PG)
keywords:
  - convert
  - pangenome
  - graph
  - gfa
  - gbz
  - vg
tools:
  - vg:
      description: Variation graph toolkit
      homepage: https://github.com/vgteam/vg
      documentation: https://github.com/vgteam/vg/wiki
      licence: ["MIT"]
      identifier: biotools:vg

input:
  - - meta:
        type: map
        description: Graph metadata
    - input_graph:
        type: file
        description: Input graph file
        pattern: "*.{vg,gbz,gfa,pg,xg}"

output:
  - gfa:
      - meta:
          type: map
          description: Graph metadata
      - "*.gfa":
          type: file
          description: GFA format graph
          pattern: "*.gfa"
  - gbz:
      - meta:
          type: map
          description: Graph metadata
      - "*.gbz":
          type: file
          description: GBZ format graph
          pattern: "*.gbz"
  - vg:
      - meta:
          type: map
          description: Graph metadata
      - "*.vg":
          type: file
          description: VG format graph
          pattern: "*.vg"
  - pg:
      - meta:
          type: map
          description: Graph metadata
      - "*.pg":
          type: file
          description: Packed graph format
          pattern: "*.pg"
  - versions:
      - "versions.yml":
          type: file
          description: File containing software versions
          pattern: "versions.yml"

authors:
  - "@jlalli"
maintainers:
  - "@jlalli"
