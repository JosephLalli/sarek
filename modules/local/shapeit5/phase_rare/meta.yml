name: shapeit5_phaserare
description: Tool to phase rare variants onto a scaffold of common variants (output of phase_common / ligate).
keywords:
  - phasing
  - rare variants
  - haplotype
  - shapeit
tools:
  - shapeit5:
      description: SHAPEIT5 estimates haplotypes in large datasets (WES/WGS/GWAS).
      homepage: https://odelaneau.github.io/shapeit5/
      documentation: https://odelaneau.github.io/shapeit5/docs/documentation
      doi: 10.1038/s41588-023-01415-5
      licence: ["MIT"]
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - input:
        type: file
        description: Genotypes to be phased in plain VCF/BCF format.
        pattern: "*.{vcf,bcf,vcf.gz,bcf.gz}"
    - input_index:
        type: file
        description: Index file of the input_plain VCF/BCF file containing genotype likelihoods.
        pattern: "*.{vcf.gz.csi,bcf.gz.csi}"
    - pedigree:
        type: file
        description: |
          Pedigree information in the following format: offspring father mother.
        pattern: "*.{txt, tsv}"
    - input_region:
        type: string
        description: |
          Region to be considered in --input-plain (e.g. chr20:1000000-2000000 or chr20).
          For chrX, please treat PAR and non-PAR regions as different choromosome in order to avoid mixing ploidy.
        pattern: "chrXX:leftBufferPosition-rightBufferPosition"
    - scaffold:
        type: file
        description: Scaffold of haplotypes in VCF/BCF format.
        pattern: "*.{vcf,bcf,vcf.gz,bcf.gz}"
    - scaffold_index:
        type: file
        description: Index file of the scaffold file.
        pattern: "*.{vcf.gz.csi,bcf.gz.csi}"
    - scaffold_region:
        type: string
        description: |
          Region to be considered in --scaffold (e.g. chr20:1000000-2000000 or chr20).
        pattern: "chrXX:leftBufferPosition-rightBufferPosition"
    - map:
        type: file
        description: File containing the genetic map in Glimpse format.
        pattern: "*.gmap"
output:
  - phased_variant:
      - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.{vcf,bcf,vcf.gz,bcf.gz}":
          type: file
          description: Phased variants in VCF/BCF format.
          pattern: "*.{vcf,bcf,vcf.gz,bcf.gz}"
  - log:
      - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.log":
          type: file
          description: Log file
          pattern: "*.log"
  - versions:
      - versions.yml:
          type: file
          description: File containing software versions
          pattern: "versions.yml"
authors:
  - "@LouisLeNezet"
  - "@lalli"
